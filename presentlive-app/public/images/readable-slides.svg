<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img"
     aria-label="A comparison of two slides: one crowded with small text, one with a single large heading and three short bullets.">
  <title>Two slides compared: crowded versus readable</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <rect width="800" height="340" rx="16" fill="#eef2ff" />

  <!-- Crowded slide -->
  <g>
    <rect x="32" y="56" width="340" height="212" rx="10" fill="url(#panel)" stroke="#e2e8f0" />
    <text x="48" y="44" font-family="Segoe UI, system-ui, sans-serif" font-size="15"
          font-weight="700" fill="#be123c">Hard to read from the back</text>
    <text x="52" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="11"
          font-weight="700" fill="#334155">Quarterly Performance Review Summary</text>
    <g fill="#94a3b8">
      <rect x="52" y="96" width="300" height="5" rx="2.5" />
      <rect x="52" y="108" width="296" height="5" rx="2.5" />
      <rect x="52" y="120" width="304" height="5" rx="2.5" />
      <rect x="52" y="132" width="286" height="5" rx="2.5" />
      <rect x="52" y="144" width="300" height="5" rx="2.5" />
      <rect x="52" y="156" width="272" height="5" rx="2.5" />
      <rect x="52" y="168" width="298" height="5" rx="2.5" />
      <rect x="52" y="180" width="290" height="5" rx="2.5" />
      <rect x="52" y="192" width="306" height="5" rx="2.5" />
      <rect x="52" y="204" width="264" height="5" rx="2.5" />
      <rect x="52" y="216" width="296" height="5" rx="2.5" />
      <rect x="52" y="228" width="248" height="5" rx="2.5" />
      <rect x="52" y="240" width="284" height="5" rx="2.5" />
    </g>
  </g>

  <!-- Arrow -->
  <g stroke="#4338ca" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M392 162h36" />
    <path d="M420 152l10 10-10 10" />
  </g>

  <!-- Readable slide -->
  <g>
    <rect x="448" y="56" width="320" height="212" rx="10" fill="url(#panel)" stroke="#c7d2fe"
          stroke-width="2" />
    <text x="464" y="44" font-family="Segoe UI, system-ui, sans-serif" font-size="15"
          font-weight="700" fill="#0f766e">Readable from anywhere</text>
    <text x="472" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="26"
          font-weight="700" fill="#1e293b">One idea</text>
    <g font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#475569">
      <circle cx="479" cy="150" r="4" fill="#4338ca" />
      <text x="496" y="155">Big type</text>
      <circle cx="479" cy="186" r="4" fill="#4338ca" />
      <text x="496" y="191">Few words</text>
      <circle cx="479" cy="222" r="4" fill="#4338ca" />
      <text x="496" y="227">Ask the room</text>
    </g>
  </g>

  <text x="400" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
        font-size="13" fill="#4338ca">
    The same content, cut down until the back row can read it.
  </text>
</svg>
